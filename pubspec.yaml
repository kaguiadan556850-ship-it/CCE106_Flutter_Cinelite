name: cinelite
description: "CinElite - Cinema Booking System (Flutter, MVVM + layered architecture, sqflite + Firebase)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Local persistence (booking history cache / offline-first)
  # sqflite only works on Android/iOS/desktop; shared_preferences backs
  # the same feature on Flutter Web (see data/datasources/local/).
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Cloud sync + auth
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
